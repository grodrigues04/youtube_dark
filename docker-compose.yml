name: youtube-dark

services:
  # Every day at 06:00 produces one YouTube Short from the latest complete research (edition A) of
  # market_trends and uploads it scheduled for 08:00. Claude runs as `node` with only its own token (see
  # runner/run-as-claude-user.sh); MONGO_URI and the YouTube credentials are visible only to the
  # root processes (research.py, publish.py).
  youtube-dark:
    build: .
    container_name: youtube-dark
    restart: unless-stopped
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      YOUTUBE_PUBLISH_HOUR: ${YOUTUBE_PUBLISH_HOUR:-8}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-4}
      TZ: America/Sao_Paulo
    volumes:
      - ./data:/data
      # Optional background songs (mp3 with a license that allows YouTube use)
      - ./music:/music:ro
